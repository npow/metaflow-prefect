name: UX Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

env:
  METAFLOW_DEFAULT_METADATA: local
  METAFLOW_DEFAULT_DATASTORE: local
  METAFLOW_DEFAULT_ENVIRONMENT: local

jobs:
  runner-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pin Metaflow local datastore root
        run: echo "METAFLOW_DATASTORE_SYSROOT_LOCAL=$HOME" >> "$GITHUB_ENV"
      - uses: Netflix/metaflow/.github/actions/run-ux-tests@npow/corral-devstack
        with:
          metaflow-ref: npow/corral-devstack
          extra-install: "."
          codecov-token: ${{ secrets.CODECOV_TOKEN }}
          pytest-args: "-n 4 -v --tb=short --timeout=180 -k 'runner' --cov-fail-under=0"
          ux-test-config: |
            backends:
              - name: prefect
                scheduler_type: prefect
                cluster: null
                decospec: null
                deploy_args:
                  work_pool: mf-local
                enabled: true

  deployer-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PREFECT_API_URL: http://127.0.0.1:4200/api
    strategy:
      fail-fast: false
      matrix:
        test:
          - test_hello_world
          - test_hello_project
          - test_from_deployment
          - test_retry
          - test_resources
          - test_catch
          - test_timeout
          - test_config_simple_default
          - test_config_simple_config_value
          - test_config_simple_config
          - test_mutable_flow_default
          - test_mutable_flow_config_value
          - test_config_corner_cases
          - test_branch
          - test_foreach
          - test_nested_foreach
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pin Metaflow local datastore root
        run: echo "METAFLOW_DATASTORE_SYSROOT_LOCAL=$HOME" >> "$GITHUB_ENV"
      - name: Install Prefect
        run: pip install prefect
      - name: Start Prefect server
        run: |
          prefect server start &
          timeout 60 bash -c \
            'until curl -sf http://127.0.0.1:4200/api/health > /dev/null; do sleep 2; done'
          echo "Prefect server is ready."
      - name: Create process work pool
        run: prefect work-pool create --type process mf-local
      - name: Start Prefect worker
        run: |
          prefect worker start --pool mf-local &
          sleep 5
      - uses: Netflix/metaflow/.github/actions/run-ux-tests@npow/corral-devstack
        with:
          metaflow-ref: npow/corral-devstack
          extra-install: "."
          pytest-args: "-v --tb=short --timeout=180 -k '${{ matrix.test }} and deployer' --cov-fail-under=0"
          ux-test-config: |
            backends:
              - name: prefect
                scheduler_type: prefect
                cluster: null
                decospec: null
                deploy_args:
                  work_pool: mf-local
                enabled: true
