[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "metaflow-prefect"
version = "0.3.5"
description = "Metaflow extension: deploy and run flows as Prefect deployments"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "metaflow>=2.10.0",
    "prefect>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
# Install src/metaflow_extensions as a namespace package.
# No __init__.py at src/metaflow_extensions/ — Metaflow requires it to be
# an implicit namespace package (PEP 420).
packages = ["src/metaflow_extensions"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "e2e: marks tests that run a real Prefect server and execute flows end-to-end",
]

[tool.pyright]
include = ["src"]
pythonVersion = "3.10"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings (trailing whitespace, blank lines)
    "F",   # pyflakes (unused imports, undefined names)
    "I",   # isort (import ordering)
    "UP",  # pyupgrade (modernise syntax)
]
ignore = [
    "E501",  # line too long — long strings in codegen are intentional
]

[tool.ruff.lint.per-file-ignores]
# _codegen.py uses %s/%r formatting deliberately — it builds Python source
# strings where the format-spec style makes the generated code shape visible.
"src/metaflow_extensions/prefect/plugins/prefect/_codegen.py" = ["UP031"]

[tool.ruff.lint.isort]
known-first-party = ["metaflow_extensions"]
